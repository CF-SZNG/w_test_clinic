<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测试一：人类早期返祖与赛博发疯大赏</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <a class="back" href="index.html">← 返回诊所</a>
  <h1>测试一：人类早期返祖与赛博发疯大赏</h1>
  <p class="lead">27题。A=1分，B=2分，C=3分。总分27–81分。</p>
  <div id="alert" class="alert"></div>
  <div id="quiz"></div>
  <button id="submit" type="button">提交诊断</button>
  <div id="result">
    <p id="score" class="score"></p>
    <h2 id="title"></h2>
    <p id="desc"></p>
    <a class="back" href="index.html">← 返回诊所</a>
  </div>
</main>
<script>
const data = [
{q:'如果现在地球立刻爆炸，只剩你一个人活下来，你的第一反应是：',opts:['A. 感谢上帝，终于不用回微信了。','B. 先去找个超市，把最贵的酒全开了，反正没人收钱。','C. 找个风水宝地躺下，开始写《地球毁灭后的第一场雨》。']},
{q:'当你看到前任在朋友圈发了一条极其做作的自拍，你脑子里弹出的第一句话是：',opts:['A. 截个图，发给共友，配文：“医学奇迹，这人没有脑子也能活。”','B. 点个赞，然后在心里默默祝ta早日确诊。','C. 默默点了个“不感兴趣”，然后继续吃手里的外卖。']},
{q:'如果必须选一个当代医学奇迹，你会选：',opts:['A. 某些人明明没有脑子，但能活到现在。','B. 我能在一堆毫无逻辑的工作/学习任务中，保持表面平静。','C. 晚上失眠emo到想死，早上醒来第一句是：“今天中午吃什么？”']},
{q:'当你的朋友半夜三点给你发：“我觉得人生毫无意义”，你的真实操作是：',opts:['A. 截个图，第二天配个表情包发回去：“半夜不睡觉，脑子进水了？”','B. 回复：“我也是。既然没意义，明天去吃顿烤肉吧，宰你一顿。”','C. 假装没看到，第二天中午回个：“昨晚睡了，怎么了？”']},
{q:'你对“正常人”的定义是：',opts:['A. 那些能在体制内安稳活下去，还能按时结婚生子的NPC。','B. 那些在生死面前还能保持微笑，心里却早已骂了一万遍脏话的人。','C. 那些被世界捶打后，依然愿意相信“明天会更好”的殉道者。']},
{q:'如果要给你的精神状态画一幅图，那必须是：',opts:['A. 一面开裂的玻璃，上面贴着很多写着“没事”“挺好的”的便利贴。','B. 一具泡在福尔马林里的骨架，正在努力用筷子吃泡面。','C. 一个粉红色的、毛茸茸的、但长着满嘴獠牙的怪兽。']},
{q:'当长辈用一种极其不屑的语气对你进行“爹味说教”时，你真实的内心戏是：',opts:['A. 一边点头说“您说得对”，一边在心里计算怎么把他的微信拉黑。','B. 用极其专业的名词反问回去，直到把对方说晕为止。','C. 想象他正在变成一只青蛙，呱呱叫，然后忍不住笑场。']},
{q:'半夜刷到一条极惨的新闻，你第一反应是：',opts:['A. 关掉手机，告诫自己：共情是种病，得治。','B. 觉得整个人类世界都是荒谬的，不如立刻去洗个冷水澡。','C. 感叹：这世道，真是一个巨大的草台班子。']},
{q:'如果“孤独”有实体，它长什么样：',opts:['A. 一个像你一样的人，坐在你旁边，但你们谁也不说话。','B. 一个巨大的黑洞，里面填满了你吃过的外卖盒。','C. 一只绿色的青蛙，蹲在你肩膀上，时不时舔你一下。']},
{q:'当你写下一段极度灰暗的文字后，你怎么处理：',opts:['A. 锁进加密文档，然后去洗把脸，继续做个情绪稳定的成年人。','B. 发给一个关系最铁的朋友，配文：“看我今天又疯得多有艺术感。”','C. 直接烧掉，或者丢进垃圾桶，仿佛什么都没发生。']},
{q:'你最想对这个世界说什么：',opts:['A. 滚。别烦我。','B. 请问能不能给我发个老婆/老公，或者直接给我一百万？','C. 别看了，我没病，你才有病。']},
{q:'如果你是一具标本，你希望被摆在：',opts:['A. 医学院的解剖台上，供学生们围观。','B. 现代艺术馆里，供游客拍照。','C. 荒无人烟的废土里，任凭风吹雨打。']},
{q:'遇到极其恶心的“吸血型”人际关系，你最优雅的断舍离方式是：',opts:['A. 慢慢冷淡，直到对方自己滚蛋。','B. 发一条极其阴阳怪气的朋友圈，专门仅ta可见。','C. 直接撕破脸，留下一句：“你这种碳基生物，不配浪费我的时间。”']},
{q:'你觉得自己最高级的幽默感是：',opts:['A. 看着别人装逼，心里暗暗笑。','B. 拿自己开涮，拿这个操蛋的世界开涮。','C. 把别人的苦难编成段子。']},
{q:'如果有一台机器能让你回到过去，你最想：',opts:['A. 回去抽小时候的自己两个大嘴巴子：“你怎么那么傻！”','B. 去看一眼秦始皇，顺便问问他是怎么想出修长城的。','C. 哪儿也不去，把机器卖了换钱。']},
{q:'你手机里最可怕的软件是：',opts:['A. 微信（因为要回消息）。','B. 闹钟（因为它叫不醒你）。','C. 备忘录（里面全是你发疯的草稿）。']},
{q:'假如你是一只动物，你会：',opts:['A. 一只猫，白天睡觉，晚上在客厅跑酷。','B. 一只蚊子，吸完血就跑。','C. 一只哈士奇，把拆家当成艺术。']},
{q:'当有人说“你这个人怎么这么没心没肺”，你会：',opts:['A. 觉得这简直是最高级的赞美。','B. 在心里反驳：“我很有心，只是没长在你身上。”','C. 差点笑出声，因为对方不知道你昨晚刚emo完。']},
{q:'你死亡后，墓碑上最希望刻的话是：',opts:['A. “终于不用再还花呗了。”','B. “生卒年不详，但此人很有趣。”','C. “禁止在此处播放《好运来》。”']},
{q:'你觉得你现在最需要的是一份：',opts:['A. 能立刻暴富的彩票。','B. 一顿极其正宗的垃圾食品（比如炸鸡）。','C. 一个能完全听懂我废话的外星人。']},
{q:'作为医学生，面对厚重如山的复习资料时，最真实的生理反应是：',opts:['A. 觉得这些知识在试图强奸我的海马体，我决定躺平任嘲。','B. 开始计算把这些书烧成灰能产生多少卡路里。','C. 幻想把出题人绑在解剖台上，用手术刀逼问重点。']},
{q:'在极其安静的自习室里，你突然放了一个响屁，你的第一反应是：',opts:['A. 假装看书，用翻书声掩盖，心里开始默念《大悲咒》。','B. 迅速环顾四周，只要我不尴尬，尴尬的就是别人。','C. 脑子里开始构思一篇《关于人类肠道气体排放的赛博朋克狂想曲》。']},
{q:'如果“成功”是一个动词，你觉得它最贴切的画面是：',opts:['A. 忍着恶心把一个月的狗屎吃完，然后拿到一张写着“优秀员工”的废纸。','B. 在烂泥地里打滚，然后指着天上的鸟说：“看，那是我的座驾。”','C. 活到90岁，在某个无人知晓的角落，痛快地骂了一句脏话然后闭眼。']},
{q:'当你看到一对情侣在公共场合疯狂秀恩爱时，你心里最恶毒的想法是：',opts:['A. 祝他们因为谁洗碗而大打出手。','B. 预测他们的多巴胺分泌还能维持多久，并准备好嘲笑他们的分手。','C. 觉得他们像两只正在互相梳理毛发、但随时可能咬断对方脖子的狒狒。']},
{q:'面对这个极度内卷的社会，你最想采取的报复方式是：',opts:['A. 彻底躺平，用我的无所作为拉低全人类的平均GDP。','B. 变得极其有钱，然后用钱去砸死那些曾经卷过我的人。','C. 成为一个隐形的黑客，每天随机给老板们的电脑弹100个色情弹窗。']},
{q:'你觉得“灵魂”这玩意儿，大概率存在于人体的哪个部位？',opts:['A. 盲肠。因为没用，且经常发炎。','B. 松果体。因为它长得像某种外星植入的控制器。','C. 根本不存在。人类只是多巴胺和一堆神经元网线的奴隶。']},
{q:'如果明天就是世界末日，你今天最后的24小时会选择怎么过？',opts:['A. 关掉手机，吃一顿高碳水的高热量垃圾食品，然后在床上瘫到死。','B. 换上最酷的衣服，去街头飙车，顺便砸碎一家奢侈品店的玻璃。','C. 像往常一样，面无表情地去上班/上课，等着看那些平时装逼的人崩溃大哭。']}
];
const results = [
{t:'赛博苦行僧',d:'你是个极度克制的反矫情达人。你早就看透了世界的荒谬，所以你选择用最冷漠、最节能的方式活着。你不发疯，因为你怕发疯会消耗太多卡路里。你最大的幽默感，就是看着别人上蹿下跳，而你在心里淡淡说一句：“演，接着演。”'},
{t:'骨科泥石流',d:'你的精神状态就像一具刚刚爬出福尔马林池、拿着骨科锯准备吃泡面的骨架。你用最严谨的医学/理科逻辑，去解构最离谱的生活现实。别人觉得你有病，你觉得别人没救。'},
{t:'绝版双面龟',d:'你表面上是老好人/社恐，内心却是一个随时准备毁灭世界的暴徒。白天在工位/教室里“嗯嗯好的”，晚上在被窝里把枕头当仇人胖揍。你的生活就是一场大型行为艺术，演给那些根本看不懂的NPC看。'},
{t:'荒诞讽刺家',d:'王小波看了都要给你递根烟。你对这个世界最大的宽容，就是用极其恶毒或自嘲的黑色幽默去嘲讽它。你看到别人受伤，第一反应不是同情，而是觉得：“这真是一个绝佳的段子素材。”'},
{t:'赛博鸭嘴兽',d:'你是一种跨物种的缝合怪。你上一秒还在悲秋伤春、思考宇宙虚无，下一秒就开始琢磨“晚上点个什么外卖”。你极其撕裂，但你觉得这种撕裂比那些假装岁月静好的人酷多了。'},
{t:'废话流刺客',d:'你的语言系统里充满了“啊对对对”、“笑死”、“离谱”。你看起来没有攻击性，但实际上你用废话构建了一堵叹息之墙。谁也走不进你的心里，因为你心里正在放脱口秀大会。'},
{t:'基因突变型喷子',d:'你极其擅长用看似专业的学术词汇，去骂人不带脏字。你就像一只刚打完狂犬疫苗的丧尸，虽然还是丧尸，但至少不会咬人。你最大的痛苦是：智力太高，而周围的草台班子太蠢。'},
{t:'重度抽象症患者',d:'你已经脱离了人类的范畴。你的笑点、泪点和你的精神坐标，都不在三微空间里。你看着人类的悲欢离合，就像在看蚂蚁搬家。你甚至觉得地球爆炸也就是一颗蓝色玻璃球碎了的物理现象。无悲无喜，只有纯粹的荒诞。'},
{t:'顶级发疯预备役',d:'你现在离“大闹一场”只差一根导火索。你的内心有一万头野马在狂奔，被你那层极薄的理智皮囊强行包裹着。你迫切需要一场极其狂野的、能打破所有规则的震荡。'},
{t:'宇宙级抽象大魔王',d:'恭喜你，你的精神状态已经遥遥领先于全人类。你已经把“自嘲、解构、发疯、虚空”融合成了一套完美的哲学闭环。你不会再问“这有什么意义”，因为你已经懂了：存在本身，就是一个巨大的、无聊的玩笑。'}
];
const quiz=document.getElementById('quiz');
const result=document.getElementById('result');
const alertEl=document.getElementById('alert');
const submitBtn=document.getElementById('submit');
data.forEach((item,i)=>{
  const div=document.createElement('div');
  div.className='question';
  let html='<p>'+(i+1)+'. '+item.q+'</p>';
  item.opts.forEach((opt,j)=>{
    html+='<label><input type="radio" name="q'+i+'" value="'+(j+1)+'"> '+opt+'</label>';
  });
  div.innerHTML=html;
  quiz.appendChild(div);
});
submitBtn.addEventListener('click',()=>{
  const answers=data.map((_,i)=>document.querySelector('input[name="q'+i+'"]:checked'));
  if(answers.some(a=>!a)){
    alertEl.textContent='请完成全部27题后再提交。';
    return;
  }
  alertEl.textContent='';
  const score=answers.reduce((s,a)=>s+Number(a.value),0);
  let idx=0;
  if(score===81) idx=9;
  else if(score>=75) idx=8;
  else if(score>=69) idx=7;
  else if(score>=63) idx=6;
  else if(score>=57) idx=5;
  else if(score>=51) idx=4;
  else if(score>=45) idx=3;
  else if(score>=39) idx=2;
  else if(score>=33) idx=1;
  else idx=0;
  const r=results[idx];
  document.getElementById('score').textContent='总分：'+score+' / 81';
  document.getElementById('title').textContent=r.t;
  document.getElementById('desc').textContent=r.d;
  quiz.style.display='none';
  submitBtn.style.display='none';
  result.style.display='block';
});
</script>
</body>
</html>
