<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测试二：你的精神结界与反吸血防御机制</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <a class="back" href="index.html">← 返回诊所</a>
  <h1>测试二：你的精神结界与反吸血防御机制</h1>
  <p class="lead">27题。A=1分，B=2分，C=3分。总分27–81分。</p>
  <div id="alert" class="alert"></div>
  <div id="quiz"></div>
  <button id="submit" type="button">提交诊断</button>
  <div id="result">
    <p id="score" class="score"></p>
    <h2 id="title"></h2>
    <p id="desc"></p>
    <a class="back" href="index.html">← 返回诊所</a>
  </div>
</main>
<script>
const data = [
{q:'当有人企图用“我是为你好”的爹味姿态对你进行说教时，你的内心微表情是：',opts:['A. 表面点头，心里已经开始起草“断交声明”。','B. 忍不住用更专业的术语反问，直到对方露出尴尬的怯意。','C. 觉得人类真有趣，并且像看猴戏一样期待他接下来能编出什么花。']},
{q:'如果你突然被拉入一个全是陌生人、且大家都在虚情假意互相吹捧的饭局：',opts:['A. 找个最角落的位置，把自己当成一尊没有感情的石膏像。','B. 用极其刻薄的目光扫视全场，在心里默默给每个人打分。','C. 突然抛出一个极其破坏气氛的哲学或毁灭性话题，看他们怎么接。']},
{q:'当你的朋友半夜连发20条60秒语音向你哭诉失恋：',opts:['A. 听第一条，回一句“抱抱，早点睡”，然后静音。','B. 直接转账20块钱让他去买杯奶茶，并警告“再发拉黑”。','C. 顺着他的话，用更绝望、更病态的视角反问他，直到他反过来安慰你。']},
{q:'你删掉一个曾经很亲密的人的联系方式，通常是因为：',opts:['A. 对方越界太多次，你甚至懒得骂，直接按下了“删除”。','B. 对方太蠢了，拉低了你周遭的智商平均水平。','C. 纯粹是今天心情不好，想换个清净的电子环境。']},
{q:'走在路上遇到发传单或者推销的人，你无法拒绝的原因是：',opts:['A. 觉得他们也不容易，出于机械性的礼貌接过来。','B. 在心里演练了一遍怎么怼回去，但实际上默默绕开了。','C. 绝不接，并且会用一种极其冷漠空洞的眼神盯着对方看，直到他心虚。']},
{q:'别人夸你“性格真好、很温和”时，你心里最真实的潜台词是：',opts:['A. 你根本不知道我半夜发疯的时候能有多阴暗。','B. 我只是懒得跟你们这群草台班子计较。','C. 谢谢，其实我只是一台待机耗电量极低的机器。']},
{q:'如果有人未经允许动了你的私人物品：',opts:['A. 表面不说，但心里已经把他划分为“不可接触的垃圾”。','B. 当场发作，用极其阴冷的语气让他立刻放下。','C. 直接把那件物品扔掉，因为觉得被污染了。']},
{q:'你在人际交往中最无法忍受的“愚蠢”是：',opts:['A. 听不懂潜台词，毫无边界感。','B. 自我感动式地付出，然后道德绑架。','C. 既没有才华，又不具备幽默感，还总是喜欢大声喧哗。']},
{q:'当你发现自己对某个人产生了好感，你的第一反应是：',opts:['A. 警惕。立刻后退三步，开始疯狂寻找对方的缺点。','B. 兴奋。觉得终于找到了一个可以仔细观察的新鲜人类样本。','C. 绝望。觉得自己的多巴胺又被基因劫持了，只觉得恶心。']},
{q:'如果给你一个绝对安全、可以合法“清除”一个人记忆的机会：',opts:['A. 把那些让我内耗的人的脑子洗成空白。','B. 把全人类关于“社交礼仪”的记忆全洗了，让大家变回原始动物。','C. 把自己的记忆洗了，看看重新开机后会不会遇到更有趣的NPC。']},
{q:'你如何看待“真心”：',opts:['A. 极其昂贵且易碎，绝不能随便拿出来给别人看。','B. 一文不值，所有关系本质上都是权力的博弈。','C. 是一种可以拿来当段子和实验材料的可悲之物。']},
{q:'当别人向你倾诉极其痛苦的创伤时，你感受不到共情，因为：',opts:['A. 你的情绪带宽早就被自己的创伤占满了。','B. 你大脑里第一个跳出来的是病理学或心理学的诊断逻辑。','C. 你觉得“痛苦”是一种非常主观且无聊的东西。']},
{q:'你在群聊里被忽视（没人接你的话）时：',opts:['A. 如释重负，终于可以不聊了。','B. 截图存档，在心里给这群人记上一笔。','C. 默默退群，就像从未存在过一样。']},
{q:'你最讨厌哪种身体接触？',opts:['A. 陌生人或者半熟的人突如其来的搭肩或拥抱。','B. 情绪激动的人抓着你的手腕不放。','C. 任何形式的高温肢体接触，会触发你的生理厌恶。']},
{q:'如果你可以变成一种病毒：',opts:['A. 一种让人突然丧失语言能力，只能互相安静对视的病毒。','B. 一种让人只要装逼，就会立刻打嗝的病毒。','C. 一种能精准靶向吞噬“爹味”和“油腻”细胞的病毒。']},
{q:'你在电梯里遇到半生不熟的同事，你的第一反应：',opts:['A. 盯着楼层数字看，心里默念“别说话、别说话”。','B. 露出一个极其冷酷的假笑，点一下头。','C. 直接开口问他一个极度尴尬的问题，欣赏他的不知所措。']},
{q:'你通常怎么处理“愤怒”？',opts:['A. 冻结。冷着脸不说话，直到对方自己感到恐惧。','B. 积压到临界点，然后用一句话把对方怼到毫无还手之力。','C. 把愤怒转化成一种极具讽刺意味的幽默。']},
{q:'你觉得什么样的人最有魅力？',opts:['A. 极度聪明，但又有一种病态的克制感。','B. 破釜沉舟，哪怕疯狂也敢于直视深渊。','C. 完全不在乎这个世界的规则，活得像个外星人。']},
{q:'当你发现别人在背后议论你：',opts:['A. 觉得可笑，并且想在下次见面时无意间露出一点“我都知道”的压迫感。','B. 觉得无所谓，他们连评价我的资格都没有。','C. 想把他们的脖子拧下来当花盆。']},
{q:'在感情里，你最怕对方对你说什么？',opts:['A. “我们不分彼此，你的一切都是我的。”','B. “我不懂你，但我爱你。”','C. “我会永远包容你的所有负面情绪。”']},
{q:'你最喜欢的“独处状态”是：',opts:['A. 一个人待在一个没有任何活人声音的空间里，如废墟、老房子。','B. 一个人戴着降噪耳机，在城市最吵闹的地方游荡。','C. 一个人躺在床上，享受极度的生理和心理的无重力感。']},
{q:'你觉得自己更接近哪种生物学分类？',opts:['A. 冷血动物。需要靠外界的阳光或电流来维持体温。','B. 深海鱼类。在极高压、极暗的地方自给自足。','C. 病毒。只有在寄生和破坏的时候才具有生命力。']},
{q:'别人对你笑的时候，你的第一反应是：',opts:['A. 他为什么对我笑？他是不是图我什么？','B. 这是一个信号，我需要用什么样的表情去回应？','C. 他笑得像个没有灵魂的假笑小丑。']},
{q:'如果有人试图用“大哭大闹”来绑架你，你会：',opts:['A. 更冷。看着对方哭，直到对方哭不下去。','B. 转身就走，就像看到了某种令人不适的排泄物。','C. 掏出手机，放一首极度不合时宜的欢快音乐，比如《好日子》。']},
{q:'你对“原生家庭”这个词的生理反应是：',opts:['A. 胃部一阵痉挛，然后立刻岔开话题。','B. 开始在心里用极其冷酷的句子分析它的病理机制。','C. 觉得这就是一个巨大的、恶心的社会笑话。']},
{q:'你手机里最舍不得删的一段记录（截图或备忘录）是：',opts:['A. 记录自己最绝望时刻的文字，那是一种美的标本。','B. 别人对你的一句极度恶毒的评价，用来提醒自己不能心软。','C. 一些旁人完全看不懂、甚至觉得有点疯的黑色幽默。']},
{q:'如果在平行宇宙里，你是一个至高无上的神明，你会怎么对待人类：',opts:['A. 把他们隔绝在一个个单间里，互不干扰。','B. 偶尔扔下一点极致的灾难，看他们表演绝望。','C. 把他们全部变回猴子，重新进化一次。']}
];
const results = [
{t:'精神无菌舱',d:'你是个极度克制的反矫情达人。你早就看透了世界的荒谬，所以你选择用最冷漠、最节能的方式活着。'},
{t:'骨科泥石流',d:'你的精神状态就像一具刚刚爬出福尔马林池、拿着骨科锯准备吃泡面的骨架。别人觉得你有病，你觉得别人没救。'},
{t:'绝版双面龟',d:'你表面上是老好人/社恐，内心却是一个随时准备毁灭世界的暴徒。演给那些根本看不懂的NPC看。'},
{t:'荒诞讽刺家',d:'你对这个世界最大的宽容，就是用极其恶毒或自嘲的黑色幽默去嘲讽它。你看到别人受伤，第一反应是觉得段子素材来了。'},
{t:'赛博鸭嘴兽',d:'你是一种跨物种的缝合怪。上一秒悲秋伤春，下一秒琢磨吃什么。'},
{t:'废话流刺客',d:'你的语言系统里充满了“啊对对对”。你用废话构建了一堵叹息之墙。谁也走不进你的心里。'},
{t:'基因突变型喷子',d:'你极其擅长用学术词汇骂人不带脏字。你最大的痛苦是：智力太高，而周围的草台班子太蠢。'},
{t:'重度抽象症患者',d:'你已经脱离了人类的范畴。你看着人类的悲欢离合，就像在看蚂蚁搬家。'},
{t:'顶级发疯预备役',d:'你内心有一万头野马在狂奔，被极薄的理智皮囊包裹着。你迫切需要一场打破所有规则的震荡。'},
{t:'宇宙级抽象大魔王',d:'存在本身，就是一个巨大的、无聊的玩笑。'}
];
const quiz=document.getElementById('quiz');
const result=document.getElementById('result');
const alertEl=document.getElementById('alert');
const submitBtn=document.getElementById('submit');
data.forEach((item,i)=>{
  const div=document.createElement('div');
  div.className='question';
  let html='<p>'+(i+1)+'. '+item.q+'</p>';
  item.opts.forEach((opt,j)=>{
    html+='<label><input type="radio" name="q'+i+'" value="'+(j+1)+'"> '+opt+'</label>';
  });
  div.innerHTML=html;
  quiz.appendChild(div);
});
submitBtn.addEventListener('click',()=>{
  const answers=data.map((_,i)=>document.querySelector('input[name="q'+i+'"]:checked'));
  if(answers.some(a=>!a)){
    alertEl.textContent='请完成全部27题后再提交。';
    return;
  }
  alertEl.textContent='';
  const score=answers.reduce((s,a)=>s+Number(a.value),0);
  let idx=0;
  if(score===81) idx=9;
  else if(score>=75) idx=8;
  else if(score>=69) idx=7;
  else if(score>=63) idx=6;
  else if(score>=57) idx=5;
  else if(score>=51) idx=4;
  else if(score>=45) idx=3;
  else if(score>=39) idx=2;
  else if(score>=33) idx=1;
  else idx=0;
  const r=results[idx];
  document.getElementById('score').textContent='总分：'+score+' / 81';
  document.getElementById('title').textContent=r.t;
  document.getElementById('desc').textContent=r.d;
  quiz.style.display='none';
  submitBtn.style.display='none';
  result.style.display='block';
});
</script>
</body>
</html>
