<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测试三：你的精神废墟与病态审美</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <a class="back" href="index.html">← 返回诊所</a>
  <h1>测试三：你的精神废墟与病态审美</h1>
  <p class="lead">27题。A=1分，B=2分，C=3分。总分27–81分。</p>
  <div id="alert" class="alert"></div>
  <div id="quiz"></div>
  <button id="submit" type="button">提交诊断</button>
  <div id="result">
    <p id="score" class="score"></p>
    <h2 id="title"></h2>
    <p id="desc"></p>
    <a class="back" href="index.html">← 返回诊所</a>
  </div>
</main>
<script>
const data = [
{q:'你闻到某种属于“老旧时光”的味道时（比如发霉的旧书、旧木头）：',opts:['A. 感到安全，像回到了不用解释自己的密室。','B. 感到一种极具宿命感的悲凉，想流泪。','C. 觉得这就是时间的尸体味。']},
{q:'如果有一个完美的“失忆”按钮：',opts:['A. 按下。把那些让人夜不能寐的记忆全部删掉。','B. 不按。痛苦是我确认自己是人类唯一的证据。','C. 按一半。保留那些痛苦的快感，但删掉内耗。']},
{q:'你最喜欢什么样的“破碎感”？',opts:['A. 一个历经沧桑、但极其安静的老人。','B. 一朵正在腐烂、但颜色极其艳丽的玫瑰。','C. 一台被抛弃在荒野里、长满铁锈的机器。']},
{q:'别人觉得“血腥”或“恐怖”的画面，对你来说：',opts:['A. 觉得无聊，因为真正的恐怖在人的心里。','B. 有一种病态的美感，让你想仔细研究。','C. 觉得他们大惊小怪，这不过是一种物质的物理形态改变。']},
{q:'你看着镜子里的自己，最常有的感觉是：',opts:['A. 陌生。觉得这具躯体只是我在现实里借用的潜水服。','B. 审视。像在观察一个随时可能发生病变的标本。','C. 毫无感觉。就像看路边的一块石头。']},
{q:'你会因为什么而感到真正的“绝望”？',opts:['A. 发现自己永远无法摆脱这种孤独的底色。','B. 意识到所有深刻的连接最终都会腐坏。','C. 知道自己再也找不到能听懂我那些阴湿废话的人了。']},
{q:'你喜欢听后朋克、致郁系音乐的原因，是因为：',opts:['A. 它们能让我在巨大的绝望里获得一种诡异的宁静。','B. 它们把疼痛具象化成了某种可以控制的声音。','C. 我觉得所谓的“快乐音乐”才是反人类的。']},
{q:'如果在雨天的深夜，你可以选择一种方式度过：',opts:['A. 坐在旧书店的橱窗边，看外面的人像游魂一样走过。','B. 在自己房间里，听一首长达十分钟的、极其压抑的纯乐器。','C. 去一个没有人的废墟，感受雨水打在身上的冰冷。']},
{q:'你渴望的那个“对的人”，如果存在的模式是：',opts:['A. 一棵在我身边默默长出年轮的老树，不需要说话，但能接住所有落叶。','B. 一把能划破我外壳的手术刀，精准地切中我的痛点，然后把我缝合。','C. 一个和我同样有着深渊，但敢于和我一起在深渊里跳舞的疯子。']},
{q:'你对于“老物件”（比如家里的旧钟表、旧中药柜、旧车）的情感是：',opts:['A. 那是我的家人，比大部分活人更值得信任。','B. 它们是时间与死亡的纪念碑。','C. 它们只是被人类赋予了无意义执念的垃圾。']},
{q:'如果有一部电影，主角在整部片子里只是静静地坐着，最后自杀了：',opts:['A. 我会觉得这是一部神作，因为它拍出了我的一部分。','B. 我会觉得导演在偷懒，真正的痛苦是连坐着都觉得痛。','C. 我会当成喜剧来看，因为人类的这种造作本身就很可笑。']},
{q:'你最爱看哪种类型的死亡？',opts:['A. 平静地，像落叶一样自然凋零。','B. 绚烂地，像烟火一样在最灿烂时炸裂。','C. 毫无预兆地，像一台突然断电的机器。']},
{q:'你会在什么时候感受到“极致的狂喜”？',opts:['A. 在极度悲伤之后的、那种生理上的虚脱感。','B. 发现有人完全听懂了我文字里的所有隐喻和恶毒。','C. 在一个没有人认识我的地方，大醉一场然后醒来。']},
{q:'你对“爱”的最深层的定义，偏向于：',opts:['A. 一场漫长的、互相观察和逐渐融合的修复过程。','B. 一种能让我心甘情愿暴露自己最脆弱腹腔的臣服感。','C. 一种可以让我暂时忘记“我是一具孤单肉体”的麻醉剂。']},
{q:'你为什么会写下那些让别人觉得“阴湿”的文字？',opts:['A. 因为我只能通过这种方式，把身体里的毒排出来。','B. 因为我想看看，能看懂这些文字的人到底有多变态。','C. 只是为了在虚无的时间里，留下一点我没有白活的证据。']},
{q:'在面对“命中注定”的离别时，你倾向于：',opts:['A. 默默接受，用漫长的时间把它内化成我身体的一部分。','B. 提前逃跑，绝不让对方有机会先抛弃我。','C. 举办一场盛大的、只有自己知道的告别仪式。']},
{q:'如果这个世界上只剩下你一个人，你最想保留的现代事物是：',opts:['A. 一个装满旧书和音乐的硬盘。','B. 一台能播放我最喜欢那首歌的音响。','C. 我的脑子，因为只有它才会让我感到痛苦和真实。']},
{q:'你认为“美”的最高形态是什么？',opts:['A. 一种随时会消逝、充满绝望的脆弱感。','B. 一种跨越了生死的、极度冷酷的秩序。','C. 一场令人无法直视的、血腥的自我解剖。']},
{q:'你有时觉得自己是在“扮演”一个正常人吗？',opts:['A. 是的，每次社交都像是一场耗尽电量的表演。','B. 甚至觉得这是一种乐趣，看我能骗过多少人。','C. 我从不扮演，我只是懒得理他们。']},
{q:'当你极度痛苦时，你的身体反应是：',opts:['A. 浑身发冷，想把自己缩成一团，藏在没有人的角落。','B. 胃部痉挛，像有一块冰冷的石头在里面坠着。','C. 感到一种奇异的平静，仿佛灵魂抽离出来看着肉体在受苦。']},
{q:'如果可以选择你墓碑上的墓志铭：',opts:['A. “生而孤独，死于寂静。”','B. “他终于不用再假装正常了。”','C. “这里埋着一个试图理解人类的异类。”']},
{q:'你最害怕的“失控”是什么？',opts:['A. 情绪崩溃，把最脆弱的一面暴露给一个可能伤害我的人。','B. 失去理智，变成一个无法自控的动物。','C. 发现自己开始真正依赖一个人，且无法离开。']},
{q:'如果有一幅画能代表你，那幅画的底色一定是：',opts:['A. 像雨天的海一样、几乎要溺死人的深灰。','B. 一种极端的、甚至有些病态的苍白。','C. 一片虚无的、连光都吸进去的纯黑。']},
{q:'你怎么看待“永远”这个词？',opts:['A. 害怕。因为永远意味着我要一直带着这具躯壳和记忆。','B. 渴望。因为这是我唯一能对抗虚无的幻觉。','C. 觉得可笑。这不过是碳基生物为了繁衍编造的谎言。']},
{q:'你最喜欢在什么样的环境里发呆？',opts:['A. 听到远处有隐约的火车声，或者是别人听不到的细微白噪音。','B. 看着一个没有任何活人的、长满荒草的旧院子。','C. 在极度拥挤的地铁里，戴着降噪耳机，感受全世界的隔膜。']},
{q:'你觉得“自我”是一个什么样的概念？',opts:['A. 一个被困在肉体里的幽灵。','B. 一堆不断被重组和打碎的拼图。','C. 一场幻觉，所有的自我都是基因和环境的阴谋。']},
{q:'当这个世界对你表现出一点微弱的善意时，你会：',opts:['A. 觉得危险，因为所有的光背后都有阴影。','B. 小心翼翼地收下，然后在心里给它建一个档案。','C. 把它当成一个观察样本，看看它能存活多久。']}
];
const results = [
{t:'绝对清醒者',d:'你是一个极其敏锐的旁观者。你太了解人性的脆弱，以至于你宁愿用冷漠来保护自己。'},
{t:'悲瘾患者',d:'你的文字里流淌着高浓度的血清素与皮质醇。痛觉是你确认自己存在的唯一方式。你像一面煎焦了一半的肉。'},
{t:'废墟拾荒者',d:'你在旧物和死物里寻找安全感。活人太吵了，只有落灰的钟表和老中药柜才能听懂你的沉默。'},
{t:'赛博幽灵',d:'你游离在人类的躯体之外，看着这一切荒诞发生。你不属于这里，你只是一个在宇宙边缘徘徊的观察样本。'},
{t:'深海鱼类',d:'你习惯了在极高压、极暗的深海处独处。外界的光太刺眼，你只需要属于自己的那点微光。'},
{t:'病态唯美主义者',d:'你在残缺、腐烂和死亡中看到了一种至高无上的美。比起虚假的繁荣，你更爱真实的伤口。'},
{t:'内向型暴徒',d:'你外表安静，内心却有一万头野马在奔腾。你不想伤害别人，但你极度渴望被彻底撕裂。'},
{t:'无重力孤儿',d:'你渴望剥离所有社会关系，回到那个没有人类痕迹的纯白空间。你只想轻盈地活下去。'},
{t:'极致痛觉系',d:'你注定要在撕裂中寻找安宁。你不怕遍体鳞伤，你只怕平庸与麻木。'},
{t:'宿命孤独者',d:'你就是马尔克斯笔下的那座孤岛。生而孤独，死于寂静。你与世界和解的方式，就是彻底孤立世界。'}
];
const quiz=document.getElementById('quiz');
const result=document.getElementById('result');
const alertEl=document.getElementById('alert');
const submitBtn=document.getElementById('submit');
data.forEach((item,i)=>{
  const div=document.createElement('div');
  div.className='question';
  let html='<p>'+(i+1)+'. '+item.q+'</p>';
  item.opts.forEach((opt,j)=>{
    html+='<label><input type="radio" name="q'+i+'" value="'+(j+1)+'"> '+opt+'</label>';
  });
  div.innerHTML=html;
  quiz.appendChild(div);
});
submitBtn.addEventListener('click',()=>{
  const answers=data.map((_,i)=>document.querySelector('input[name="q'+i+'"]:checked'));
  if(answers.some(a=>!a)){
    alertEl.textContent='请完成全部27题后再提交。';
    return;
  }
  alertEl.textContent='';
  const score=answers.reduce((s,a)=>s+Number(a.value),0);
  let idx=0;
  if(score===81) idx=9;
  else if(score>=75) idx=8;
  else if(score>=69) idx=7;
  else if(score>=63) idx=6;
  else if(score>=57) idx=5;
  else if(score>=51) idx=4;
  else if(score>=45) idx=3;
  else if(score>=39) idx=2;
  else if(score>=33) idx=1;
  else idx=0;
  const r=results[idx];
  document.getElementById('score').textContent='总分：'+score+' / 81';
  document.getElementById('title').textContent=r.t;
  document.getElementById('desc').textContent=r.d;
  quiz.style.display='none';
  submitBtn.style.display='none';
  result.style.display='block';
});
</script>
</body>
</html>
